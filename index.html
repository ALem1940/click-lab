<!DOCTYPE html>
<html lang="en" data-theme="light">
	<head>
		<title>Quiz</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
		<link rel="stylesheet" href="css/card.css">
		<link rel="stylesheet" href="css/choice-list.css">
		<link rel="stylesheet" href="style.css">
		<script src="script.js" defer></script>
		
	</head>
	<body>
		<div class="banner">New questions added every Friday.</div>
		<div class="hero">
			<h1 id="headline-1">Know your history?</h1>
			<p id="tagline-1">Take the quiz</p>
		</div>
		</div>
		
		<header>
		</header>
		
		<main>
			<div class="card">
				<h3>Which country is the oldest?</h3>
				<p>Pick one</p>
			
				<div id="choice-list">
					<button type="button" id="first-1">Ethopia</button>
					<button type="button" id="second-1">Canada</button>
					<button type="button" id="third-1">Italy</button>
				</div>
			</div>
			<div class="card">
				<h3>Which country is home of the richest king to ever live?</h3>
				<p>Pick one</p>
				
				<div id="choice-list">
					<button type="button" id="first-2">France</button>
					<button type="button" id="second-2">China</button>
					<button type="button" id="third-2">Mali</button>
				</div>
			</div>
			<div class="card">
				<h3>Which country is the most mountainous?</h3>
				<p>Pick one</p>
			
				<div id="choice-list">
					<button type="button" id="first-3">Nepal</button>
					<button type="button" id="second-3">China</button>
					<button type="button" id="third-3">Bhutan</button>
				</div>
		</main>
		
	
		<footer>
		<p>Created by:Ashanti S. Lemonia(Tsasa)</p>
		</footer>

	</body>
</html>
