<!DOCTYPE html>
<html lang="en" data-theme="light">
	<head>
		<title>Quiz</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
		<link rel="stylesheet" href="css/card.css">
		<link rel="stylesheet" href="css/choice-list.css">
		<link rel="stylesheet" href="css/style.css">
		<script src="script.js" defer></script>
		
	</head>
	<body>
		<div class="banner">New questions added every Friday.</div>
			<div class="cover">
				<div class="hero">
					<h1 id="headline-1">Know your history?</h1>
					<p id="tagline-1">Take the quiz</p>
				</div>
			
		
		<header>
		</header>
		
		<main>
			<div class="card" id="card-1">
				<h3>Which country is the oldest?</h3>
				<p id="msg-1">Pick one</p>
			
				<div class="choice-list">
					<button type="button" id="first-1">Ethopia</button>
					<button type="button" id="second-1">Canada</button>
					<button type="button" id="third-1">Italy</button>
				</div>
			</div>
			<div class="card" id="card-2">
				<h3>Which country is home of the richest king to ever live?</h3>
				<p id="msg-2">Pick one</p>
				
				<div class="choice-list">
					<button type="button" id="first-2">Mali</button>
					<button type="button" id="second-2">China</button>
					<button type="button" id="third-2">France</button>
				</div>
			</div>
			<div class="card" id="card-3">
				<h3>Which country is the most mountainous?</h3>
				<p id="msg-3">Pick one</p>
			
				<div class="choice-list">
					<button type="button" id="first-3">Bhutan</button>
					<button type="button" id="second-3">China</button>
					<button type="button" id="third-3">Nepal</button>
				</div>
			</div>
			<button id="reset">Reset</button>
		</main>
		
	
		<footer>
		<hr>
		<p style="color:yellow;">Created by: Ashanti S. Lemonia(Tsasa)</p>
		</footer>
		
		<!--<script src="script.js"></script>-->
	</body>
</html>
